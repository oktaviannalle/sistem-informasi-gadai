<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Outer Cyan Circle Arc -->
  <path d="M 250,50 A 200,200 0 1,1 120,400 A 185,185 0 0,0 250,75 A 175,175 0 1,0 425,250 A 175,175 0 0,0 350,110 L 375,85 A 200,200 0 0,1 450,250 A 200,200 0 0,1 250,450 A 200,200 0 0,1 60,320 L 80,300 A 180,180 0 0,0 250,430 A 180,180 0 0,0 430,250 A 180,180 0 0,0 250,70 Z" fill="url(#cyanGrad)"/>

  <!-- Outer Blue Arc Top Left -->
  <path d="M 120,100 C 180,50 300,50 370,110 C 310,75 190,75 135,120 Z" fill="url(#blueGrad)"/>

  <!-- Banknotes (Tilted Cyan Lines with Dollar Sign) -->
  <!-- Note 1 (Back) -->
  <rect x="140" y="210" width="110" height="150" rx="8" transform="rotate(-30 195 285)" fill="none" stroke="#06b6d4" stroke-width="10"/>
  <!-- Note 2 (Middle) -->
  <rect x="180" y="180" width="110" height="150" rx="8" transform="rotate(-15 235 255)" fill="none" stroke="#06b6d4" stroke-width="10"/>
  <!-- Note 3 (Front with $) -->
  <g transform="rotate(0 280 250)">
    <rect x="220" y="160" width="110" height="160" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="10"/>
    <text x="275" y="260" font-family="sans-serif" font-weight="bold" font-size="75" fill="#06b6d4" text-anchor="middle">$</text>
  </g>

  <!-- Big Swooping Arrow (Royal Blue) -->
  <path d="M 50,440 C 150,420 300,320 440,180 L 400,160 L 470,140 L 450,210 L 420,175 C 290,300 150,390 50,440 Z" fill="url(#blueGrad)"/>
</svg>
